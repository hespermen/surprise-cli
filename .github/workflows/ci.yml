# Проверки на каждый push и PR.
#
# Главная здесь — «Бандл собран из этих исходников». Всё остальное (типы,
# тесты) полезно, но его наличие никого не удивит; а вот сверка бандла
# закрывает единственную дыру, которой у проекта нет другой защиты.
#
# Дело в том, что dist/cli.js ЗАКОММИЧЕН и именно он исполняется у людей:
# установка из git собирать не умеет (npm не ставит devDependencies при
# глобальной установке), поэтому артефакт лежит в репозитории. Отсюда следует
# неприятное: правка ОДНОГО этого файла, без единой строки в src/, при ревью
# диффа по исходникам невидима, а мегабайтный файл GitHub схлопывает как
# «large file» и не показывает вовсе. Двадцать изменённых строк среди тридцати
# тысяч не увидит никто.
#
# Эта сверка делает такую правку невозможной незаметно: пересобираем из
# исходников и требуем побайтового совпадения.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Токену читать достаточно: ничего публиковать и коммитить мы отсюда не будем.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Та же мажорная версия, что у разработчика: сборка детерминирована
          # при фиксированном дереве зависимостей, но не между версиями Node.
          node-version: 22
          cache: npm

      # ci, а не install: install переразрешает каретки против живого реестра,
      # и дерево зависимостей поехало бы — вместе с байтами бандла.
      - run: npm ci

      - name: Типы
        run: npm run typecheck

      - name: Тесты
        run: npm test

      - name: Бандл собран из этих исходников
        run: |
          cp dist/cli.js /tmp/committed.js
          npm run build
          if ! cmp -s /tmp/committed.js dist/cli.js; then
            echo "::error::dist/cli.js не совпадает с пересобранным из src/."
            echo ""
            echo "Это значит одно из двух:"
            echo "  1. Забыли пересобрать после правок в src/ — сделайте 'npm run build' и закоммитьте."
            echo "  2. Бандл правили отдельно от исходников — а вот это уже повод разбираться."
            echo ""
            echo "Размеры: закоммичен $(wc -c < /tmp/committed.js), пересобран $(wc -c < dist/cli.js)"
            exit 1
          fi
          echo "Совпадает побайтово."
